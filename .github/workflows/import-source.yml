name: Import reviewed source archive
on:
  push:
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand reviewed source
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('source-import.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '8af989215366ee01c8cb2bfe48b198e289018e1e39bbee861f173eb3deb9ad17'
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  assert target.is_relative_to(root) and '.git' not in pathlib.PurePosixPath(item.filename).parts
                  assert not item.filename.startswith('.github/')
              z.extractall(root)
      - name: Commit source tree and remove one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm source-import.zip .github/workflows/import-source.yml
          git add .
          git commit -m 'Import SpireForge AI source, bilingual UI and documentation'
          git push origin HEAD:main
